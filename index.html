<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fungames</title>
<link rel="icon" type="image/png" href="Logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FunGames">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffc90e">
<style>
  @font-face{
    font-family:'PixelTitle';
    src:local('Press Start 2P');
  }
  :root{
    --blue:#2b6bff;
    --blue-dark:#1c4fd6;
    --ink:#12141a;
    --ink-dim:#6b7280;
    --line:#e7e9ee;
    --paper:#ffffff;
    --grid:#f3f5f8;
    --green:#1fa15a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI',-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;
    min-height:100vh;
  }

  header{
    padding:28px 24px 20px;
    border-bottom:2px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:16px 16px;
    mask-image:linear-gradient(to bottom, black, transparent 85%);
    pointer-events:none;
  }
  .headerInner{max-width:1080px;margin:0 auto;position:relative;}
  .headTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'PixelTitle', ui-monospace, 'Courier New', monospace;
    font-size:10px;letter-spacing:2px;color:var(--blue);
    background:#eef3ff;border:1px solid #d6e2ff;border-radius:20px;
    padding:6px 12px;margin-bottom:16px;
  }
  .eyebrow .dot{width:6px;height:6px;background:var(--blue);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  h1{
    font-family:'PixelTitle', ui-monospace, 'Courier New', monospace;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:1px;
    margin:0 0 6px;
    line-height:1.3;
  }
  h1 span{color:var(--blue);}
  .sub{color:var(--ink-dim);font-size:14px;margin:0 0 24px;}

  .searchRow{position:relative;max-width:420px;margin-bottom:16px;}
  .searchRow svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-dim);}
  #searchInput{
    width:100%;padding:12px 16px 12px 40px;
    border:2px solid var(--ink);border-radius:10px;
    font-size:14px;color:var(--ink);background:var(--paper);
    outline:none;
  }
  #searchInput:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbe6ff;}
  #searchInput::placeholder{color:#9aa1ad;}

  .catRow{display:flex;flex-wrap:wrap;gap:8px;}
  .catChip{
    font-size:12px;font-weight:700;letter-spacing:0.2px;
    padding:7px 13px;border-radius:20px;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  .catChip.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  main{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
  .countRow{font-size:12px;color:var(--ink-dim);margin-bottom:16px;letter-spacing:0.3px;}
  #countNum{color:var(--ink);font-weight:700;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:22px;
  }
  .gameCard{
    border:2px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
    background:var(--paper);
    display:flex;flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .gameCard:hover{transform:translateY(-4px);box-shadow:6px 6px 0 var(--ink);}
  .gameCard[data-bg="1"]{cursor:pointer;}

  .thumb{
    aspect-ratio:4/3;
    background:#eaf7ee;
    display:flex;align-items:center;justify-content:center;
    border-bottom:2px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  .thumb svg{width:72%;height:72%;image-rendering:pixelated;}
  .thumb img{width:100%;height:100%;object-fit:cover;}

  .cardBody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .gameTitle{font-weight:800;font-size:15px;}
  .gameTag{font-size:11px;color:var(--ink-dim);letter-spacing:0.3px;}

  .playBtn{
    margin-top:12px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--blue);color:#fff;text-decoration:none;
    font-weight:800;font-size:13px;letter-spacing:0.3px;
    padding:10px 14px;border-radius:8px;border:2px solid var(--ink);
  }
  .playBtn:hover{background:var(--blue-dark);}
  .playBtn:active{transform:translateY(1px);}

  .linkRow{display:flex;gap:8px;margin-top:8px;}
  .linkBtn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:var(--paper);color:var(--ink);text-decoration:none;
    font-weight:700;font-size:12px;letter-spacing:0.2px;
    padding:8px 10px;border-radius:8px;border:2px solid var(--ink);
  }
  .linkBtn:hover{background:var(--grid);}

  .emptyState{
    text-align:center;color:var(--ink-dim);font-size:13px;
    padding:60px 20px;display:none;
  }

  .errorOverlay{
    position:fixed;inset:0;z-index:999;
    background:rgba(18,20,26,0.55);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .errorCard{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:16px;
    padding:36px 28px 30px;
    max-width:360px;width:100%;
    text-align:center;
    box-shadow:8px 8px 0 var(--ink);
  }
  .errorCode{
    font-family:ui-monospace,'Courier New',monospace;
    font-size:15px;letter-spacing:1px;
    color:var(--ink-dim);
    margin-bottom:14px;
  }
  .errorFace{
    font-size:44px;line-height:1;margin-bottom:10px;
  }
  .errorMsg{
    font-weight:800;font-size:20px;margin-bottom:24px;
  }
  .errBtns{display:flex;gap:10px;}
  .errBtn{
    flex:1;font-weight:800;font-size:13px;
    padding:11px 12px;border-radius:8px;border:2px solid var(--ink);
    cursor:pointer;background:var(--paper);color:var(--ink);
  }
  .errBtn.errBtnPrimary{background:var(--blue);color:#fff;}
  .errBtn.errBtnPrimary:hover{background:var(--blue-dark);}
  .errBtn:not(.errBtnPrimary):hover{background:var(--grid);}
  .offlineGameLink{
    display:none;margin:16px 0 0;font-size:13px;font-weight:800;color:var(--blue);
    background:none;border:none;cursor:pointer;padding:0;
    text-decoration:underline;
  }
  .offlineGameSection{
    display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
  }
  .offlineGameHint{font-size:11px;color:var(--ink-dim);margin-bottom:8px;}
  #offlineGameCanvas{
    display:block;width:100%;max-width:280px;margin:0 auto;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;
  }
  #offlineGameCanvas{touch-action:none;-webkit-tap-highlight-color:transparent;}
  .offTouchRow{display:flex;justify-content:center;gap:12px;margin-top:10px;}
  .offTouchBtn{
    flex:1;max-width:120px;height:52px;font-size:24px;font-weight:800;
    border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .offTouchBtn.pressed{background:var(--grid);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .offlineScoreRow{
    display:flex;justify-content:center;gap:18px;
    font-family:ui-monospace,'Courier New',monospace;
    font-size:11px;color:var(--ink-dim);margin-top:8px;
  }
  .offlineScoreRow b{color:var(--ink);}

  .headRight{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .clock{
    font-family:ui-monospace,'Courier New',monospace;
    font-size:22px;font-weight:700;letter-spacing:2px;
    color:var(--ink);background:var(--paper);
    border:2px solid var(--ink);border-radius:8px;
    padding:6px 12px;box-shadow:3px 3px 0 var(--ink);
    font-variant-numeric:tabular-nums;
  }

  .settingsBtn{
    font-weight:800;font-size:12px;letter-spacing:0.3px;
    padding:9px 13px;border-radius:8px;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
    box-shadow:3px 3px 0 var(--ink);
  }
  .settingsBtn:hover{background:var(--grid);}
  .settingsBtn:disabled{opacity:.6;cursor:default;}
  .offlineMsg{
    font-size:11px;font-weight:700;color:var(--ink-dim);
    text-align:right;max-width:230px;line-height:1.4;
  }
  .offlineMsg:empty{display:none;}
  .settingsOfflineMsg{text-align:left;max-width:none;padding:2px 0 4px;}
  .settingsDetailBtn:disabled{opacity:.6;cursor:default;}
  .gameFrameWrap{position:fixed;inset:0;z-index:9000;background:#000;display:none;flex-direction:column;}
  .gameFrameBar{display:flex;align-items:center;gap:8px;background:#ffc90e;color:#4a3200;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top,0px));font-weight:800;}
  .gameFrameBar .gfTitle{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gameFrameBar button{border:0;border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;background:#fff;color:#4a3200;font-family:inherit;}
  .gameFrameWrap iframe{flex:1;width:100%;border:0;background:#fff;}
  .fgToast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:10000;background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.3);display:none;max-width:90vw;}
  .fgFlash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:10001;}
  .fgFlash.go{animation:fgFlash .35s ease-out;}
  @keyframes fgFlash{0%{opacity:.85}100%{opacity:0}}
  .clockOptions{max-height:220px;overflow-y:auto;}
  .clockOptions .langOption{flex-shrink:0;}
  .langOption small{font-weight:600;opacity:.7;margin-left:8px;}

  .settingsOverlay{
    position:fixed;inset:0;z-index:1002;
    background:rgba(18,20,26,0.55);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .settingsOverlay.active{display:flex;}
  .settingsCard{
    max-height:90vh;overflow-y:auto;
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:16px;
    padding:22px 24px 26px;
    max-width:340px;width:100%;
    box-shadow:8px 8px 0 var(--ink);
  }
  .settingsHeader{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .settingsTitle{font-weight:800;font-size:19px;}
  .settingsCloseBtn{
    border:none;background:none;font-size:18px;cursor:pointer;
    color:var(--ink-dim);line-height:1;padding:2px;
  }
  .settingsCloseBtn:hover{color:var(--ink);}
  .settingsRow{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-top:1px solid var(--line);
  }
  .settingsRowLabel{font-weight:700;font-size:14px;}
  .settingsDetailBtn{
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    font-weight:800;font-size:12px;padding:6px 10px;border-radius:7px;
    cursor:pointer;
  }
  .settingsDetailBtn:hover{background:var(--grid);}
  .languageOptions{
    display:none;flex-direction:column;gap:8px;
    padding:4px 0 6px;
  }
  .languageOptions.open{display:flex;}
  .langOption{
    display:flex;align-items:center;justify-content:space-between;
    border:2px solid var(--ink);border-radius:8px;
    background:var(--paper);color:var(--ink);
    font-weight:700;font-size:13px;padding:10px 12px;cursor:pointer;
  }
  .langOption:hover{background:var(--grid);}
  .langOption.active{background:var(--blue);color:#fff;}

  footer{
    border-top:2px solid var(--ink);
    padding:18px 24px;text-align:center;
    color:var(--ink-dim);font-size:11px;
    font-family:ui-monospace,'Courier New',monospace;
    letter-spacing:0.5px;
  }

</style>
</head>
<body>

<header>
  <div class="headerInner">
    <div class="headTop">
      <div>
        <div class="eyebrow"><span class="dot"></span> ARCADE ONLINE</div>
        <h1>Fun<span>Games</span><img src="Logo.png" width="45"></h1>
        <p class="sub" id="subtitleEl">브라우저에서 바로 즐기는 재미있는 게임 모음</p>
      </div>
      <div class="headRight">
        <div class="clock" id="clock">00:00:00</div>
        <button class="settingsBtn" id="settingsBtn">⚙ <span id="settingsBtnLabel">설정</span></button>
      </div>
    </div>

    <div class="searchRow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="게임 이름으로 검색...">
    </div>
    <div class="catRow" id="catRow"></div>
  </div>
</header>

<main>
  <div class="countRow"><span id="countNum">2</span><span id="countSuffixEl">개의 게임</span></div>
  <div class="grid" id="grid"></div>
  <div class="emptyState" id="emptyState">검색 결과가 없어요. 다른 조건으로 찾아보세요.</div>
</main>

<footer>FUNGAMES — PRESS PLAY TO START</footer>

<div class="settingsOverlay" id="settingsOverlay">
  <div class="settingsCard">
    <div class="settingsHeader">
      <div class="settingsTitle" id="settingsTitleEl">설정</div>
      <button class="settingsCloseBtn" id="settingsCloseBtn">✕</button>
    </div>
    <div class="settingsRow">
      <div class="settingsRowLabel" id="languageLabelEl">언어</div>
      <button class="settingsDetailBtn" id="languageDetailBtn">자세히 ▾</button>
    </div>
    <div class="languageOptions" id="languageOptions">
      <button class="langOption" data-lang="ko">한국어</button>
      <button class="langOption" data-lang="en">English</button>
    </div>
    <div class="settingsRow">
      <div class="settingsRowLabel" id="clockLabelEl">시계</div>
      <button class="settingsDetailBtn" id="clockDetailBtn">자세히 ▾</button>
    </div>
    <div class="languageOptions clockOptions" id="clockOptions"></div>
    <div class="settingsRow">
      <div class="settingsRowLabel" id="offlineLabelEl">오프라인 저장</div>
      <button class="settingsDetailBtn" id="offlineBtn">📥 <span id="offlineBtnLabel">저장</span></button>
    </div>
    <div class="offlineMsg settingsOfflineMsg" id="offlineMsg"></div>
    <div class="settingsRow" id="installRow">
      <div class="settingsRowLabel" id="installLabelEl">앱 설치</div>
      <button class="settingsDetailBtn" id="installBtn">📲 <span id="installBtnLabel">설치</span></button>
    </div>
    <div class="offlineMsg settingsOfflineMsg" id="installMsg"></div>
    <div class="settingsRow">
      <div class="settingsRowLabel" id="inappLabelEl">앱 안에서 열기</div>
      <button class="settingsDetailBtn" id="inappBtn">자동</button>
    </div>
  </div>
</div>

<div class="errorOverlay" id="errorOverlay">
  <div class="errorCard">
    <div class="errorCode" id="errorCode">404</div>
    <button class="offlineGameLink" id="offlineGameLink">오프라인게임 플레이하기 ▶</button>
    <div class="errorFace">(×_×)</div>
    <div class="errorMsg" id="errorMsg">접속불가</div>
    <div class="errBtns">
      <button class="errBtn errBtnPrimary" id="retryBtn">재접속</button>
      <button class="errBtn" id="exitBtn">나가기</button>
    </div>
    <div class="offlineGameSection" id="offlineGameSection">
      <div class="offlineGameHint" id="offlineGameHint">← → (또는 A D) · 폰은 아래 버튼을 누르거나 화면을 드래그해서 폭탄을 피하세요 · 터치/클릭/Space로 시작</div>
      <canvas id="offlineGameCanvas" width="280" height="140"></canvas>
      <div class="offTouchRow">
        <button class="offTouchBtn" id="offLeftBtn" aria-label="왼쪽">◀</button>
        <button class="offTouchBtn" id="offRightBtn" aria-label="오른쪽">▶</button>
      </div>
      <div class="offlineScoreRow">
        <div><span id="offScoreLbl">점수</span> <b id="offScoreVal">0</b></div>
        <div><span id="offBestLbl">최고점수</span> <b id="offBestVal">0</b></div>
      </div>
    </div>
  </div>
</div>

<div class="gameFrameWrap" id="gameFrameWrap">
  <div class="gameFrameBar">
    <button id="gfClose">✕ 닫기</button>
    <span class="gfTitle" id="gfTitle"></span>
    <button id="gfExternal" title="browser">↗</button>
  </div>
  <iframe id="gameFrame" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope; clipboard-write" allowfullscreen></iframe>
</div>

let currentLang = localStorage.getItem('fungames_lang') || 'en';

const BUILTIN_GAMES = [

let audioCtx = null;
function playClickSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }catch(e){ /* audio unsupported, ignore */ }
}

const gameFrameWrap = document.getElementById('gameFrameWrap');
const gameFrame = document.getElementById('gameFrame');
let gameFrameUrl = '';
function detectApp(){
  try{ if(/[?&]source=pwa\b/.test(location.search)) sessionStorage.setItem('fg_pwa','1'); }catch(e){}
  let flag = false; try{ flag = sessionStorage.getItem('fg_pwa') === '1'; }catch(e){}
  const mm = q => window.matchMedia && matchMedia(q).matches;
  return flag || navigator.standalone === true || /^android-app:/.test(document.referrer || '') ||
    mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || mm('(display-mode: minimal-ui)') || mm('(display-mode: window-controls-overlay)');
}
function inAppPref(){ try{ return localStorage.getItem('fungames_inapp') || 'auto'; }catch(e){ return 'auto'; } }
function inStandaloneApp(){
  const pref = inAppPref();
  if(pref === 'on') return true;
  if(pref === 'off') return false;
  return detectApp();
}
function openGameInApp(game){ openUrlInApp(game.url, game.name); }
function openUrlInApp(url, title){
  gameFrameUrl = url;
  const lang = (typeof currentLang !== 'undefined' && currentLang === 'en') ? 'en' : 'ko';
  document.getElementById('gfClose').textContent = lang === 'en' ? '✕ Close' : '✕ 닫기';
  document.getElementById('gfTitle').textContent = title || '';
  gameFrame.src = url;
  gameFrameWrap.style.display = 'flex';
  try{ history.pushState({fgGame:1}, ''); }catch(e){}
}
function closeGameInApp(fromPop){
  if(gameFrameWrap.style.display !== 'flex') return;
  gameFrameWrap.style.display = 'none';
  gameFrame.src = 'about:blank';
  if(!fromPop){ try{ if(history.state && history.state.fgGame) history.back(); }catch(e){} }
}

function openGameInNewTab(game){
  if(inStandaloneApp()){ openGameInApp(game); return true; }
  // noopener 를 쓰면 반환값이 항상 null 이라 성공 여부를 알 수 없어서, 열고 나서 opener 를 끊어요.
  let w = null;
  try{ w = window.open(game.url, '_blank'); }catch(e){ w = null; }
  if(!w){ showError(573); return false; }   // 573: 게임 창을 열 수 없음(차단 등)
  try{ w.opener = null; }catch(e){}
  return true;
}

function applyErrorText(){
  const t = errT();
  document.getElementById('retryBtn').textContent = t.retry;
  document.getElementById('exitBtn').textContent = (currentErrorCode === 383) ? t.cont : t.close;
  document.getElementById('offlineGameHint').textContent = t.hint;
  document.getElementById('offScoreLbl').textContent = t.score;
  document.getElementById('offBestLbl').textContent = t.best;
  if(currentErrorCode !== null) errorMsgEl.textContent = t.labels[currentErrorCode] || t.unknown;
  offlineGameLinkEl.textContent = (offlineGameSection.style.display === 'block') ? t.offFold : t.offPlay;
}

function showError(code){
  currentErrorCode = code;
  errorCodeEl.textContent = code;
  offlineGameLinkEl.style.display = (code === 100) ? 'block' : 'none';
  if(code !== 100) collapseOfflineGame();
  applyErrorText();
  errorOverlay.style.display = 'flex';
}
function hideError(){
  currentErrorCode = null;
  errorOverlay.style.display = 'none';
  collapseOfflineGame();
}

async function attemptOpen(game){
  pendingGame = game;
  hideError();

  if(game.removed){
    showError(546);
    return;
  }
  if(!navigator.onLine){
    showError(100);
    return;
  }

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 6000);
  try{
    await fetch(game.url, {mode:'no-cors', signal:controller.signal, cache:'no-store'});
    clearTimeout(timer);
    openGameInNewTab(game);
  }catch(err){
    clearTimeout(timer);
    if(!navigator.onLine){
      showError(100);
    }else if(err && (err.name === 'AbortError' || err instanceof TypeError)){
      showError(404);
    }else{
      showError(276);
    }
  }
}

document.getElementById('retryBtn').addEventListener('click', ()=>{
  if(currentErrorCode === 383){ location.reload(); return; }
  if(pendingGame) attemptOpen(pendingGame);
});

  return looksGarbled(document.title) || (t && looksGarbled(t.textContent));
}

// ---- embedded offline game (no network needed, works fully offline) ----
const offlineGameSection = document.getElementById('offlineGameSection');
const offCanvas = document.getElementById('offlineGameCanvas');
const offCtx = offCanvas.getContext('2d');
const offScoreVal = document.getElementById('offScoreVal');
const offBestVal = document.getElementById('offBestVal');

const OFF_W = offCanvas.width, OFF_H = offCanvas.height;
const OFF_GROUND_Y = OFF_H - 18;
let offBest = parseInt(localStorage.getItem('bombDodgeHighScore') || '0', 10);
offBestVal.textContent = offBest;

const offPlayer = { w: 16, h: 16, speed: 3.2 };
let offBombs = [];
let offKeys = {};
let offScore = 0;
let offLastMilestone = 0;
let offSpawnTimer = 0;
let offSpawnInterval = 800;
let offFallSpeed = 1.8;
let offRunning = false;
let offGameOver = false;
let offLastTime = 0;
let offElapsed = 0;
let offRafId = null;
let offDragX = null;

function offBeep(freq, dur, type, vol){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol || 0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur);
  }catch(e){}
}
function offSfxHit(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.35);
  }catch(e){}
}

function offlineStart(){
  offPlayer.x = OFF_W/2 - offPlayer.w/2;
  offPlayer.y = OFF_GROUND_Y - offPlayer.h;
  offBombs = [];
  offScore = 0;
  offLastMilestone = 0;
  offSpawnTimer = 0;
  offSpawnInterval = 800;
  offFallSpeed = 1.8;
  offRunning = true;
  offGameOver = false;
  offElapsed = 0;
  offLastTime = performance.now();
  if(offRafId) cancelAnimationFrame(offRafId);
  offRafId = requestAnimationFrame(offlineLoop);
}

function offlineSpawnBomb(){
  const size = 8 + Math.random()*5;
  offBombs.push({
    x: Math.random() * (OFF_W - size),
    y: -size,
    size,
    speed: offFallSpeed + Math.random()*1
  });
}

function offRectsOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function offlineUpdate(dt){
  if(!offRunning) return;
  offElapsed += dt;
  offSpawnInterval = Math.max(220, 800 - offElapsed/1000 * 10);
  offFallSpeed = 1.8 + offElapsed/1000 * 0.05;

  if(offKeys['ArrowLeft'] || offKeys['a'] || offKeys['A']) offPlayer.x -= offPlayer.speed;
  if(offKeys['ArrowRight'] || offKeys['d'] || offKeys['D']) offPlayer.x += offPlayer.speed;
  if(offKeys['__left']) offPlayer.x -= offPlayer.speed;
  if(offKeys['__right']) offPlayer.x += offPlayer.speed;
  if(offDragX !== null) offPlayer.x = offDragX - offPlayer.w/2;   // 손가락을 따라 이동
  offPlayer.x = Math.max(2, Math.min(OFF_W - offPlayer.w - 2, offPlayer.x));

  offSpawnTimer += dt;
  if(offSpawnTimer >= offSpawnInterval){
    offSpawnTimer = 0;
    offlineSpawnBomb();
  }

  const pBox = { x: offPlayer.x, y: offPlayer.y, w: offPlayer.w, h: offPlayer.h };
  for(let i = offBombs.length - 1; i >= 0; i--){
    const b = offBombs[i];
    b.y += b.speed * (dt / 16.67);
    if(offRectsOverlap(pBox, { x:b.x, y:b.y, w:b.size, h:b.size })){
      offlineEnd();
      return;
    }
    if(b.y > OFF_H) offBombs.splice(i, 1);
  }

  offScore += dt * 0.012;
  const disp = Math.floor(offScore);
  offScoreVal.textContent = disp;
  if(disp > 0 && disp % 100 === 0 && disp !== offLastMilestone){
    offLastMilestone = disp;
    offBeep(900, 0.08, 'square', 0.1);
  }
}

function offlineEnd(){
  offRunning = false;
  offGameOver = true;
  offSfxHit();
  const finalScore = Math.floor(offScore);
  if(finalScore > offBest){
    offBest = finalScore;
    localStorage.setItem('bombDodgeHighScore', String(offBest));
    offBestVal.textContent = offBest;
  }
  offlineDraw();
}

function offlineDraw(){
  offCtx.clearRect(0, 0, OFF_W, OFF_H);
  offCtx.strokeStyle = '#e7e9ee';
  offCtx.lineWidth = 2;
  offCtx.beginPath();
  offCtx.moveTo(0, OFF_GROUND_Y);
  offCtx.lineTo(OFF_W, OFF_GROUND_Y);
  offCtx.stroke();

  offCtx.fillStyle = '#12141a';
  offCtx.fillRect(offPlayer.x, offPlayer.y, offPlayer.w, offPlayer.h);

  offBombs.forEach(b=>{
    offCtx.beginPath();
    offCtx.fillStyle = '#6b7280';
    offCtx.arc(b.x + b.size/2, b.y + b.size/2, b.size/2, 0, Math.PI*2);
    offCtx.fill();
  });

  if(!offRunning){
    offCtx.fillStyle = 'rgba(255,255,255,0.85)';
    offCtx.fillRect(0, 0, OFF_W, OFF_H);
    offCtx.fillStyle = '#12141a';
    offCtx.textAlign = 'center';
    offCtx.font = 'bold 13px sans-serif';
    offCtx.fillText(offGameOver ? '게임 오버 · ' + Math.floor(offScore) + '점' : '폭탄 피하기', OFF_W/2, OFF_H/2 - 6);
    offCtx.font = '10px sans-serif';
    offCtx.fillStyle = '#6b7280';
    offCtx.fillText('터치·클릭·Space로 ' + (offGameOver ? '재시작' : '시작'), OFF_W/2, OFF_H/2 + 12);
  }
}

function offlineLoop(now){
  const dt = Math.min(48, now - offLastTime);
  offLastTime = now;
  offlineUpdate(dt);
  offlineDraw();
  if(offRunning) offRafId = requestAnimationFrame(offlineLoop);
}

async function registerSW(){
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return null;
  try{ return await navigator.serviceWorker.register('/sw.js'); }catch(e){}   // 사이트 루트: 모든 게임을 덮어요
  try{ return await navigator.serviceWorker.register('sw.js'); }catch(e){ return null; }
}
const swRegistered = registerSW();

function warmUp(url){
  return new Promise(resolve=>{
    const f = document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts allow-same-origin');
    f.setAttribute('aria-hidden','true');
    f.tabIndex = -1;
    f.style.cssText = 'position:fixed;left:-9999px;top:0;width:360px;height:640px;border:0;opacity:0;pointer-events:none';
    let done = false;
    const fin = ()=>{ if(done) return; done = true; f.remove(); resolve(); };
    f.onload = ()=>setTimeout(fin, 4000);   // 늦게 불러오는 파일도 저장되게 잠깐 기다려요
    setTimeout(fin, 25000);
    f.src = url;
    document.body.appendChild(f);
  });
}

offlineBtn.addEventListener('click', async ()=>{
  const t = offT();
  if(!window.caches){ offlineMsg.textContent = t.unsupported; return; }
  offlineBtn.disabled = true;
  try{
    const reg = await swRegistered;
    if(!reg){ offlineMsg.textContent = t.unsupported; return; }
    await navigator.serviceWorker.ready;
    const urls = [...new Set(getAllGames().flatMap(g=>[g.url, g.bgUrl]).filter(Boolean))];
    let ok = 0;
    for(let i=0;i<urls.length;i++){
      offlineMsg.textContent = `${t.saving} ${i+1}/${urls.length}`;
      await warmUp(urls[i]);
      if(await caches.match(urls[i], {ignoreSearch:true})) ok++;
    }
    offlineMsg.textContent = ok===urls.length ? `${t.done} (${ok}/${urls.length})`
                           : ok>0 ? `${ok}/${urls.length}${t.partial}` : t.failed;
  }catch(e){
    offlineMsg.textContent = t.failed;
  }finally{
    offlineBtn.disabled = false;
  }
});

  try{
    await loadHtml2Canvas();
    const canvas = await html2canvas(document.documentElement, {
      useCORS:true, backgroundColor:null, scale:Math.min(window.devicePixelRatio || 1, 2),
      width:window.innerWidth, height:window.innerHeight, windowWidth:window.innerWidth, windowHeight:window.innerHeight,
      x:window.scrollX, y:window.scrollY,
      ignoreElements:el=>el === fgToast || el === fgFlash
    });
    const a = document.createElement('a');
    const d = new Date(), z = n=>String(n).padStart(2,'0');
    a.download = `fungames-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
    a.href = canvas.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove();
    fgFlash.classList.remove('go'); void fgFlash.offsetWidth; fgFlash.classList.add('go');
    showToast(capT().done, 2200);
  }catch(err){
    showToast(capT().fail, 3000);
  }
  capturing = false;
}
window.addEventListener('keydown', e=>{
  if(e.key === 'F12' || e.keyCode === 123){
    e.preventDefault(); e.stopPropagation();
    capturePage();
  }
}, true);

// ---- 개발자 도구가 열리면 창 닫기 ----
(function(){
  let bypass = false;
  try{
    if(/[?&]dev=1\b/.test(location.search)) sessionStorage.setItem('fg_dev','1');
    bypass = sessionStorage.getItem('fg_dev') === '1';
  }catch(e){}
  if(bypass) return;
  let closed = false;
  function shutDown(){
    if(closed) return; closed = true;
    try{ window.close(); }catch(e){}
    try{ document.documentElement.innerHTML = ''; }catch(e){}
    try{ location.replace('about:blank'); }catch(e){}
  }
  const bait = new Image();
  Object.defineProperty(bait, 'id', { get(){ shutDown(); return ''; } });
  function check(){
    if(closed) return;
    // 1) 개발자 도구가 열려 있으면 debugger 에서 멈춰서 시간이 오래 걸려요
    const t0 = performance.now();
    (function(){ debugger; })();
    if(performance.now() - t0 > 120){ shutDown(); return; }
    // 2) 콘솔이 열려 있으면 console.log 가 객체 속성을 읽어요
    try{ console.log(bait); console.clear(); }catch(e){}
  }
  setInterval(check, 1000);
  window.addEventListener('resize', check);
})();
</script>
