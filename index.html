<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fungames</title>
<style>
  @font-face{
    font-family:'PixelTitle';
    src:local('Press Start 2P');
  }
  :root{
    --blue:#2b6bff;
    --blue-dark:#1c4fd6;
    --ink:#12141a;
    --ink-dim:#6b7280;
    --line:#e7e9ee;
    --paper:#ffffff;
    --grid:#f3f5f8;
    --green:#1fa15a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI',-apple-system,'Malgun Gothic','맑은 고딕',sans-serif;
    min-height:100vh;
  }

  header{
    padding:28px 24px 20px;
    border-bottom:2px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:16px 16px;
    mask-image:linear-gradient(to bottom, black, transparent 85%);
    pointer-events:none;
  }
  .headerInner{max-width:1080px;margin:0 auto;position:relative;}
  .headTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'PixelTitle', ui-monospace, 'Courier New', monospace;
    font-size:10px;letter-spacing:2px;color:var(--blue);
    background:#eef3ff;border:1px solid #d6e2ff;border-radius:20px;
    padding:6px 12px;margin-bottom:16px;
  }
  .eyebrow .dot{width:6px;height:6px;background:var(--blue);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  h1{
    font-family:'PixelTitle', ui-monospace, 'Courier New', monospace;
    font-size:clamp(28px,5vw,44px);
    letter-spacing:1px;
    margin:0 0 6px;
    line-height:1.3;
  }
  h1 span{color:var(--blue);}
  .sub{color:var(--ink-dim);font-size:14px;margin:0 0 24px;}

  .searchRow{position:relative;max-width:420px;margin-bottom:16px;}
  .searchRow svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-dim);}
  #searchInput{
    width:100%;padding:12px 16px 12px 40px;
    border:2px solid var(--ink);border-radius:10px;
    font-size:14px;color:var(--ink);background:var(--paper);
    outline:none;
  }
  #searchInput:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbe6ff;}
  #searchInput::placeholder{color:#9aa1ad;}

  .catRow{display:flex;flex-wrap:wrap;gap:8px;}
  .catChip{
    font-size:12px;font-weight:700;letter-spacing:0.2px;
    padding:7px 13px;border-radius:20px;border:2px solid var(--ink);
    background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  .catChip.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  main{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
  .countRow{font-size:12px;color:var(--ink-dim);margin-bottom:16px;letter-spacing:0.3px;}
  #countNum{color:var(--ink);font-weight:700;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:22px;
  }
  .gameCard{
    border:2px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
    background:var(--paper);
    display:flex;flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .gameCard:hover{transform:translateY(-4px);box-shadow:6px 6px 0 var(--ink);}

  .thumb{
    aspect-ratio:4/3;
    background:#eaf7ee;
    display:flex;align-items:center;justify-content:center;
    border-bottom:2px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  .thumb svg{width:72%;height:72%;image-rendering:pixelated;}
  .thumb img{width:100%;height:100%;object-fit:cover;}

  .cardBody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .gameTitle{font-weight:800;font-size:15px;}
  .gameTag{font-size:11px;color:var(--ink-dim);letter-spacing:0.3px;}

  .playBtn{
    margin-top:12px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--blue);color:#fff;text-decoration:none;
    font-weight:800;font-size:13px;letter-spacing:0.3px;
    padding:10px 14px;border-radius:8px;border:2px solid var(--ink);
  }
  .playBtn:hover{background:var(--blue-dark);}
  .playBtn:active{transform:translateY(1px);}

  .linkRow{display:flex;gap:8px;margin-top:8px;}
  .linkBtn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    background:var(--paper);color:var(--ink);text-decoration:none;
    font-weight:700;font-size:12px;letter-spacing:0.2px;
    padding:8px 10px;border-radius:8px;border:2px solid var(--ink);
  }
  .linkBtn:hover{background:var(--grid);}

  .emptyState{
    text-align:center;color:var(--ink-dim);font-size:13px;
    padding:60px 20px;display:none;
  }

  .errorOverlay{
    position:fixed;inset:0;z-index:999;
    background:rgba(18,20,26,0.55);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .errorCard{
    background:var(--paper);
    border:2px solid var(--ink);
    border-radius:16px;
    padding:36px 28px 30px;
    max-width:360px;width:100%;
    text-align:center;
    box-shadow:8px 8px 0 var(--ink);
  }
  .errorCode{
    font-family:ui-monospace,'Courier New',monospace;
    font-size:15px;letter-spacing:1px;
    color:var(--ink-dim);
    margin-bottom:14px;
  }
  .errorFace{
    font-size:44px;line-height:1;margin-bottom:10px;
  }
  .errorMsg{
    font-weight:800;font-size:20px;margin-bottom:24px;
  }
  .errBtns{display:flex;gap:10px;}
  .errBtn{
    flex:1;font-weight:800;font-size:13px;
    padding:11px 12px;border-radius:8px;border:2px solid var(--ink);
    cursor:pointer;background:var(--paper);color:var(--ink);
  }
  .errBtn.errBtnPrimary{background:var(--blue);color:#fff;}
  .errBtn.errBtnPrimary:hover{background:var(--blue-dark);}
  .errBtn:not(.errBtnPrimary):hover{background:var(--grid);}
  .offlineGameLink{
    display:none;margin:16px 0 0;font-size:13px;font-weight:800;color:var(--blue);
    background:none;border:none;cursor:pointer;padding:0;
    text-decoration:underline;
  }
  .offlineGameSection{
    display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
  }
  .offlineGameHint{font-size:11px;color:var(--ink-dim);margin-bottom:8px;}
  #offlineGameCanvas{
    display:block;width:100%;max-width:280px;margin:0 auto;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;
  }
  .offlineScoreRow{
    display:flex;justify-content:center;gap:18px;
    font-family:ui-monospace,'Courier New',monospace;
    font-size:11px;color:var(--ink-dim);margin-top:8px;
  }
  .offlineScoreRow b{color:var(--ink);}

  footer{
    border-top:2px solid var(--ink);
    padding:18px 24px;text-align:center;
    color:var(--ink-dim);font-size:11px;
    font-family:ui-monospace,'Courier New',monospace;
    letter-spacing:0.5px;
  }

</style>

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let audioCtx = null;
function playClickSound(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1200, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
    gain.gain.setValueAtTime(0.18, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }catch(e){ /* audio unsupported, ignore */ }
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('.catChip, .playBtn, .linkBtn, .errBtn')){
    playClickSound();
  }
}, true);

const errorMsgEl = document.getElementById('errorMsg');
const offlineGameLinkEl = document.getElementById('offlineGameLink');
let pendingGame = null;
let currentErrorCode = null;

const ERROR_LABELS = {
  100: '인터넷 연결 불가',
  404: '접속 불가',
  546: '게임삭제',
  276: '알 수 없는 오류'
};

function showError(code){
  currentErrorCode = code;
  errorCodeEl.textContent = code;
  errorMsgEl.textContent = ERROR_LABELS[code] || '알 수 없는 오류';
  offlineGameLinkEl.style.display = (code === 100) ? 'block' : 'none';
  if(code !== 100) collapseOfflineGame();
  errorOverlay.style.display = 'flex';
}
function hideError(){
  currentErrorCode = null;
  errorOverlay.style.display = 'none';
  collapseOfflineGame();
}

async function attemptOpen(game){
  pendingGame = game;
  hideError();

  if(game.removed){
    showError(546);
    return;
  }
  if(!navigator.onLine){
    showError(100);
    return;
  }

  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), 6000);
  try{
    await fetch(game.url, {mode:'no-cors', signal:controller.signal, cache:'no-store'});
    clearTimeout(timer);
    window.open(game.url, '_blank', 'noopener');
  }catch(err){
    clearTimeout(timer);
    if(!navigator.onLine){
      showError(100);
    }else if(err && (err.name === 'AbortError' || err instanceof TypeError)){
      showError(404);
    }else{
      showError(276);
    }
  }
}

document.getElementById('retryBtn').addEventListener('click', ()=>{
  if(pendingGame) attemptOpen(pendingGame);
});
document.getElementById('exitBtn').addEventListener('click', hideError);

window.addEventListener('online', ()=>{
  if(currentErrorCode === 100) hideError();
});

const OFF_W = offCanvas.width, OFF_H = offCanvas.height;
const OFF_GROUND_Y = OFF_H - 18;
let offBest = parseInt(localStorage.getItem('bombDodgeHighScore') || '0', 10);
offBestVal.textContent = offBest;

const offPlayer = { w: 16, h: 16, speed: 3.2 };
let offBombs = [];
let offKeys = {};
let offScore = 0;
let offLastMilestone = 0;
let offSpawnTimer = 0;
let offSpawnInterval = 800;
let offFallSpeed = 1.8;
let offRunning = false;
let offGameOver = false;
let offLastTime = 0;
let offElapsed = 0;
let offRafId = null;

function offBeep(freq, dur, type, vol){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol || 0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur);
  }catch(e){}
}
function offSfxHit(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.35);
  }catch(e){}
}

function offlineStart(){
  offPlayer.x = OFF_W/2 - offPlayer.w/2;
  offPlayer.y = OFF_GROUND_Y - offPlayer.h;
  offBombs = [];
  offScore = 0;
  offLastMilestone = 0;
  offSpawnTimer = 0;
  offSpawnInterval = 800;
  offFallSpeed = 1.8;
  offRunning = true;
  offGameOver = false;
  offElapsed = 0;
  offLastTime = performance.now();
  if(offRafId) cancelAnimationFrame(offRafId);
  offRafId = requestAnimationFrame(offlineLoop);
}

function offlineSpawnBomb(){
  const size = 8 + Math.random()*5;
  offBombs.push({
    x: Math.random() * (OFF_W - size),
    y: -size,
    size,
    speed: offFallSpeed + Math.random()*1
  });
}

function offRectsOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function offlineUpdate(dt){
  if(!offRunning) return;
  offElapsed += dt;
  offSpawnInterval = Math.max(220, 800 - offElapsed/1000 * 10);
  offFallSpeed = 1.8 + offElapsed/1000 * 0.05;

  if(offKeys['ArrowLeft'] || offKeys['a'] || offKeys['A']) offPlayer.x -= offPlayer.speed;
  if(offKeys['ArrowRight'] || offKeys['d'] || offKeys['D']) offPlayer.x += offPlayer.speed;
  offPlayer.x = Math.max(2, Math.min(OFF_W - offPlayer.w - 2, offPlayer.x));

  offSpawnTimer += dt;
  if(offSpawnTimer >= offSpawnInterval){
    offSpawnTimer = 0;
    offlineSpawnBomb();
  }

  const pBox = { x: offPlayer.x, y: offPlayer.y, w: offPlayer.w, h: offPlayer.h };
  for(let i = offBombs.length - 1; i >= 0; i--){
    const b = offBombs[i];
    b.y += b.speed * (dt / 16.67);
    if(offRectsOverlap(pBox, { x:b.x, y:b.y, w:b.size, h:b.size })){
      offlineEnd();
      return;
    }
    if(b.y > OFF_H) offBombs.splice(i, 1);
  }

  offScore += dt * 0.012;
  const disp = Math.floor(offScore);
  offScoreVal.textContent = disp;
  if(disp > 0 && disp % 100 === 0 && disp !== offLastMilestone){
    offLastMilestone = disp;
    offBeep(900, 0.08, 'square', 0.1);
  }
}

function offlineEnd(){
  offRunning = false;
  offGameOver = true;
  offSfxHit();
  const finalScore = Math.floor(offScore);
  if(finalScore > offBest){
    offBest = finalScore;
    localStorage.setItem('bombDodgeHighScore', String(offBest));
    offBestVal.textContent = offBest;
  }
  offlineDraw();
}

function offlineDraw(){
  offCtx.clearRect(0, 0, OFF_W, OFF_H);
  offCtx.strokeStyle = '#e7e9ee';
  offCtx.lineWidth = 2;
  offCtx.beginPath();
  offCtx.moveTo(0, OFF_GROUND_Y);
  offCtx.lineTo(OFF_W, OFF_GROUND_Y);
  offCtx.stroke();

  offCtx.fillStyle = '#12141a';
  offCtx.fillRect(offPlayer.x, offPlayer.y, offPlayer.w, offPlayer.h);

  offBombs.forEach(b=>{
    offCtx.beginPath();
    offCtx.fillStyle = '#6b7280';
    offCtx.arc(b.x + b.size/2, b.y + b.size/2, b.size/2, 0, Math.PI*2);
    offCtx.fill();
  });

  if(!offRunning){
    offCtx.fillStyle = 'rgba(255,255,255,0.85)';
    offCtx.fillRect(0, 0, OFF_W, OFF_H);
    offCtx.fillStyle = '#12141a';
    offCtx.textAlign = 'center';
    offCtx.font = 'bold 13px sans-serif';
    offCtx.fillText(offGameOver ? '게임 오버 · ' + Math.floor(offScore) + '점' : '폭탄 피하기', OFF_W/2, OFF_H/2 - 6);
    offCtx.font = '10px sans-serif';
    offCtx.fillStyle = '#6b7280';
    offCtx.fillText('클릭 또는 Space로 ' + (offGameOver ? '재시작' : '시작'), OFF_W/2, OFF_H/2 + 12);
  }
}

function offlineLoop(now){
  const dt = Math.min(48, now - offLastTime);
  offLastTime = now;
  offlineUpdate(dt);
  offlineDraw();
  if(offRunning) offRafId = requestAnimationFrame(offlineLoop);
}

offCanvas.addEventListener('click', ()=>{ if(!offRunning) offlineStart(); });
window.addEventListener('keydown', (e)=>{
  offKeys[e.key] = true;
  if((e.key === ' ' || e.key === 'Enter') && offlineGameSection.style.display !== 'none'){
    e.preventDefault();
    if(!offRunning) offlineStart();
  }
});
window.addEventListener('keyup', (e)=>{ offKeys[e.key] = false; });

function collapseOfflineGame(){
  offRunning = false;
  if(offRafId) cancelAnimationFrame(offRafId);
  offlineGameSection.style.display = 'none';
  offlineGameLinkEl.textContent = '오프라인게임 플레이하기 ▶';
}

offlineGameLinkEl.addEventListener('click', ()=>{
  const showing = offlineGameSection.style.display !== 'none';
  if(showing){
    collapseOfflineGame();
  }else{
    offlineGameSection.style.display = 'block';
    offlineGameLinkEl.textContent = '오프라인게임 접기 ▲';
    offlineDraw();
  }
});

let activeCategory = '전체';
const catRow = document.getElementById('catRow');
function renderCatChips(){
  const cats = ['전체', ...CATEGORIES];
  catRow.innerHTML = cats.map(c=>`<button class="catChip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`).join('');
  catRow.querySelectorAll('.catChip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCategory = btn.dataset.cat;
      renderCatChips();
      renderGrid();
    });
  });
}

const grid = document.getElementById('grid');
const countNum = document.getElementById('countNum');
const emptyState = document.getElementById('emptyState');
const searchInput = document.getElementById('searchInput');

function normalize(s){ return (s||'').toLowerCase().trim(); }

function renderGrid(){
  const q = normalize(searchInput.value);
  const games = getAllGames().filter(g=>{
    if(!g.published) return false;
    if(activeCategory==='전체' && g.hideInAll) return false;
    if(activeCategory!=='전체' && g.category!==activeCategory) return false;
    if(q && !normalize(g.name).includes(q)) return false;
    return true;
  });

  countNum.textContent = games.length;
  emptyState.style.display = games.length===0 ? 'block' : 'none';

  grid.innerHTML = games.map(g=>`
    <div class="gameCard">
      <div class="thumb">
        ${thumbInnerHTML(g)}
      </div>
      <div class="cardBody">
        <div class="gameTitle">${escapeHtml(g.name)}</div>
        <div class="gameTag">${escapeHtml(g.tag || g.category)}</div>
        <a class="playBtn" href="${escapeHtml(g.url)}" data-id="${escapeHtml(g.id)}" rel="noopener">▶ 플레이</a>
        <div class="linkRow">
          ${g.homeUrl ? `<a class="linkBtn" href="${escapeHtml(g.homeUrl)}" target="_blank" rel="noopener">🏠 홈페이지</a>` : ''}
          ${g.faqUrl ? `<a class="linkBtn" href="${escapeHtml(g.faqUrl)}" target="_blank" rel="noopener">❓ FAQ</a>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

searchInput.addEventListener('input', renderGrid);

grid.addEventListener('click', (e)=>{
  const btn = e.target.closest('.playBtn');
  if(btn){
    e.preventDefault();
    const game = getAllGames().find(g=>g.id === btn.dataset.id);
    if(game) attemptOpen(game);
  }
});

renderCatChips();
renderGrid();
</script>
